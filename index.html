<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-title" content="단어장">
<meta name="theme-color" content="#16202A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>일본어 단어장</title>
<style>
  /* 다크 단일 테마 플래시카드 */
  :root{
    color-scheme:dark;
    --ink:#16202A;
    --ink-2:#1E2B38;
    --paper:#F6F2E9;
    --paper-dim:#DED7C8;
    --line:rgba(246,242,233,.14);
    --matsu:#4E8C6A;
    --shu:#C4503A;
    --gold:#C9A44C;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}

  /* ---------- 헤더 ---------- */
  header{
    padding:12px 16px 10px;
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .head-row{display:flex;align-items:center;gap:12px;}
  .deck-name{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .count{font-variant-numeric:tabular-nums;font-size:14px;color:var(--paper-dim);}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    font-size:16px;background:rgba(246,242,233,.07);
  }
  .icon-btn:active{background:rgba(246,242,233,.16);}
  .bar{height:3px;background:rgba(246,242,233,.12);border-radius:2px;margin-top:10px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s ease;}
  .meta{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--paper-dim);
    font-variant-numeric:tabular-nums;}
  .meta b{font-weight:600;color:var(--paper);}

  /* ---------- 카드 ---------- */
  main{flex:1 1 auto;display:flex;flex-direction:column;padding:0 16px;min-height:0;}
  .card{
    flex:1 1 auto;margin:14px 0;background:var(--paper);color:var(--ink);
    border-radius:var(--radius);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:24px 18px;position:relative;overflow:hidden;min-height:0;
  }
  .card::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold);
  }
  .star{position:absolute;top:10px;right:12px;font-size:20px;color:var(--paper-dim);line-height:1;padding:4px;}
  .star.on{color:var(--gold);}
  .chip{position:absolute;top:14px;left:14px;font-size:11px;color:#8A8272;}
  .kanji{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:clamp(40px,15vw,80px);font-weight:600;line-height:1.25;
    letter-spacing:.04em;word-break:keep-all;
  }
  .kana{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:clamp(18px,5.5vw,26px);color:#6F6656;margin-top:14px;min-height:1.4em;
    opacity:0;transition:opacity .18s ease;
  }
  .ko{
    font-size:clamp(17px,5vw,23px);font-weight:600;margin-top:10px;min-height:1.4em;
    opacity:0;transition:opacity .18s ease;color:#2B3440;
  }
  .show{opacity:1;}
  .notrans{transition:none !important;}
  .wrong-tag{
    position:absolute;bottom:14px;left:0;right:0;font-size:11px;color:var(--shu);font-weight:600;
  }

  /* ---------- 버튼 ---------- */
  .reveal{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .reveal button{
    padding:15px 0;border-radius:11px;font-size:16px;font-weight:600;
    background:var(--ink-2);border:1px solid var(--line);
  }
  .reveal button:active{background:#2A3A4A;}
  .reveal button.done{color:#6E7A86;}
  .judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px;}
  .judge button{padding:17px 0;border-radius:11px;font-size:17px;font-weight:700;color:#fff;}
  .know{background:var(--matsu);}
  .dont{background:var(--shu);}
  .judge button:active{filter:brightness(.9);}
  footer{flex:0 0 auto;padding:0 16px 6px;}

  /* ---------- 시작/결과 화면 ---------- */
  .screen{
    position:fixed;inset:0;background:var(--ink);z-index:20;overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px);
    -webkit-overflow-scrolling:touch;
  }
  .screen.hidden{display:none;}
  .title{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:30px;font-weight:600;letter-spacing:.02em;margin:0 0 4px;
  }
  .sub{color:var(--paper-dim);font-size:14px;margin:0 0 26px;}
  .back{font-size:15px;color:var(--gold);padding:6px 0;margin:-6px 0 14px;font-weight:600;}
  .deck .s{display:block;font-size:12px;font-weight:400;color:var(--paper-dim);margin-top:3px;}
  .sec{font-size:13px;color:var(--paper-dim);margin:22px 0 9px;}
  .deck{
    width:100%;text-align:left;background:var(--ink-2);border:1px solid var(--line);
    border-radius:12px;padding:15px 16px;margin-bottom:9px;display:flex;align-items:center;gap:12px;
  }
  .deck:active{background:#2A3A4A;}
  .deck .t{flex:1;font-size:16px;font-weight:600;}
  .deck .n{font-size:13px;color:var(--paper-dim);font-variant-numeric:tabular-nums;}
  .deck.off{opacity:.4;}
  .toggle{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:var(--ink-2);border:1px solid var(--line);
    border-radius:12px;margin-bottom:9px;font-size:15px;
  }
  .sw{width:50px;height:30px;border-radius:15px;background:rgba(246,242,233,.18);position:relative;flex:0 0 auto;}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:var(--paper);transition:transform .16s ease;}
  .sw.on{background:var(--matsu);}
  .sw.on::after{transform:translateX(20px);}
  .big{
    width:100%;padding:17px;border-radius:12px;background:var(--gold);color:#1B1305;
    font-size:17px;font-weight:700;margin-top:20px;
  }
  .ghost{
    width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);
    font-size:15px;font-weight:600;margin-top:9px;color:var(--paper);
  }
  .score{display:flex;gap:10px;margin:22px 0 4px;}
  .score div{flex:1;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .score b{display:block;font-size:26px;font-variant-numeric:tabular-nums;}
  .score span{font-size:12px;color:var(--paper-dim);}
  .list{margin-top:6px;}
  .row{
    display:flex;align-items:baseline;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);
  }
  .row .j{font-family:"Hiragino Mincho ProN",serif;font-size:18px;flex:0 0 auto;}
  .row .r{font-size:12px;color:var(--paper-dim);flex:0 0 auto;}
  .row .m{font-size:13px;color:var(--paper-dim);margin-left:auto;text-align:right;}
  .note{font-size:12px;color:#7C8590;line-height:1.6;margin-top:24px;}
  @media (min-width:700px){
    body{max-width:520px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);}
    .screen{max-width:520px;left:50%;transform:translateX(-50%);}
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <button class="icon-btn" id="btnHome" aria-label="목록으로">✕</button>
    <div class="deck-name" id="deckName">단어장</div>
    <div class="count" id="count">0 / 0</div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="meta">
    <span>공부시간 <b id="clock">00:00</b></span>
    <span>모름 <b id="wrongN">0</b></span>
    <span>남은 카드 <b id="leftN">0</b></span>
  </div>
</header>

<main>
  <div class="card" id="card">
    <div class="chip" id="chip"></div>
    <button class="star" id="star" aria-label="어려운 단어 표시">☆</button>
    <div class="kanji" id="kanji">—</div>
    <div class="kana" id="kana"></div>
    <div class="ko" id="ko"></div>
    <div class="wrong-tag" id="wrongTag"></div>
  </div>
  <div class="reveal">
    <button id="btnKana">ひらがな</button>
    <button id="btnKo">한국어 뜻</button>
  </div>
</main>

<footer>
  <div class="judge">
    <button class="know" id="btnKnow">알고있음</button>
    <button class="dont" id="btnDont">모름</button>
  </div>
</footer>

<!-- 시작 화면 -->
<section class="screen" id="home">
  <button class="back" id="btnBooks" hidden>‹ 단어장 목록</button>
  <h1 class="title" id="homeTitle">日本語 単語帳</h1>
  <p class="sub" id="homeSub">단어장을 고른 뒤, 공부할 과를 선택하세요.</p>

  <div class="sec" id="secLabel">단어장</div>
  <div id="deckList"></div>

  <div id="settings" hidden>
  <div class="sec">설정</div>
  <div class="toggle"><span>순서 섞기</span><div class="sw on" id="swShuffle"></div></div>
  <div class="toggle"><span>모른 단어 바로 다시 나오기</span><div class="sw on" id="swRepeat"></div></div>
  <div class="toggle"><span>뜻을 먼저 보고 한자 맞히기</span><div class="sw" id="swReverse"></div></div>
  </div>

  <p class="note">
    ‘모름’을 누른 단어는 같은 회독 안에서 다시 나오고, 회독이 끝나면 모른 단어만 모아 한 번 더 돌릴 수 있습니다.
    ☆ 표시는 기기에 저장되어 다음에 열 때도 남아 있습니다.
  </p>
</section>

<!-- 결과 화면 -->
<section class="screen hidden" id="result">
  <h1 class="title" id="resTitle">1회독 완료</h1>
  <p class="sub" id="resSub"></p>
  <div class="score">
    <div><b id="resKnow">0</b><span>알고있음</span></div>
    <div><b id="resDont">0</b><span>모름</span></div>
    <div><b id="resTime">00:00</b><span>공부시간</span></div>
  </div>
  <div class="sec" id="resListLabel">다시 볼 단어</div>
  <div class="list" id="resList"></div>
  <button class="big" id="btnAgainWrong">모르는 단어만 다시</button>
  <button class="ghost" id="btnAgainAll">처음부터 다시</button>
  <button class="ghost" id="btnBackHome">과 목록</button>
</section>

let DECKS = [];
let curBook = null;

/* ---------------- 저장소 (사파리 프라이빗 모드 대비) ---------------- */
const store = (()=>{
  let mem = {};
  let ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); } catch(e){ ok = false; }
  return {
    get(k,d){ try{ const v = ok ? localStorage.getItem(k) : mem[k];
      return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k,v){ try{ const s=JSON.stringify(v); if(ok) localStorage.setItem(k,s); else mem[k]=s; }catch(e){} }
  };
})();

let starred = new Set(store.get("starred_app",[]));
const opts = Object.assign({shuffle:true,repeat:true,reverse:false}, store.get("opts",{}));

/* ---------------- 상태 ---------------- */
let queue=[], cur=null, curDeck=null, total=0, resolved=new Set();
let knowCount=0, wrongSet=new Set(), wrongOrder=[];
let seconds=0, timer=null, revealed={kana:false,ko:false};

const $ = id => document.getElementById(id);

/* ---------------- 시작 화면 ---------------- */
function renderHome(){
  const list = $("deckList");
  list.innerHTML = "";
  const atBooks = !curBook;
  $("btnBooks").hidden = atBooks;
  $("settings").hidden = atBooks;

  if(atBooks){
    $("homeTitle").textContent = "日本語 単語帳";
    $("homeSub").textContent = "단어장을 고른 뒤, 공부할 과를 선택하세요.";
    $("secLabel").textContent = "단어장";
    BOOKS.forEach(b=>{
      const n = b.decks.reduce((a,d)=>a+d.words.length,0);
      const btn = deckBtn(b.name, n+"단어", ()=>{ curBook=b; DECKS=b.decks; renderHome(); $("home").scrollTop=0; });
      const sub = document.createElement("span"); sub.className="s"; sub.textContent=b.sub;
      btn.querySelector(".t").appendChild(sub);
      list.appendChild(btn);
    });
    return;
  }

  $("homeTitle").textContent = curBook.name;
  $("homeSub").textContent = curBook.sub;
  $("secLabel").textContent = "과 선택";
  DECKS.forEach(d=>{
    list.appendChild(deckBtn(d.name, d.words.length+"단어", ()=>start(d.name, d.words)));
  });
  const all = DECKS.flatMap(d=>d.words);
  list.appendChild(deckBtn("전체 단어", all.length+"단어", ()=>start("전체 단어", all)));

  const st = all.filter(w=>starred.has(w[0]));
  const b = deckBtn("☆ 어려운 단어", st.length+"단어", ()=> st.length && start("☆ 어려운 단어", st));
  if(!st.length) b.classList.add("off");
  list.appendChild(b);

  setSw("swShuffle",opts.shuffle); setSw("swRepeat",opts.repeat); setSw("swReverse",opts.reverse);
}
$("btnBooks").onclick = ()=>{ curBook=null; DECKS=[]; renderHome(); $("home").scrollTop=0; };
function deckBtn(title, n, fn){
  const b = document.createElement("button");
  b.className = "deck";
  b.innerHTML = '<span class="t"></span><span class="n"></span>';
  b.querySelector(".t").textContent = title;
  b.querySelector(".n").textContent = n;
  b.onclick = fn;
  return b;
}
function setSw(id,on){ $(id).classList.toggle("on",!!on); }
[["swShuffle","shuffle"],["swRepeat","repeat"],["swReverse","reverse"]].forEach(([id,key])=>{
  $(id).onclick = ()=>{ opts[key]=!opts[key]; setSw(id,opts[key]); store.set("opts",opts); };
});

/* ---------------- 학습 시작 ---------------- */
function start(name, words){
  curDeck = {name, words};
  buildRound(words);
  $("home").classList.add("hidden");
  $("result").classList.add("hidden");
  $("deckName").textContent = name;
  seconds = 0; startTimer();
  next();
}
function buildRound(words){
  queue = words.slice();
  if(opts.shuffle) shuffle(queue);
  total = queue.length;
  resolved = new Set();
  knowCount = 0; wrongSet = new Set(); wrongOrder = [];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

function startTimer(){
  clearInterval(timer);
  timer = setInterval(()=>{ seconds++; $("clock").textContent = fmt(seconds); },1000);
  $("clock").textContent = fmt(0);
}
function fmt(s){ const m=String(Math.floor(s/60)).padStart(2,"0"); return m+":"+String(s%60).padStart(2,"0"); }

/* ---------------- 카드 표시 ---------------- */
function hideInstant(el){
  el.classList.add("notrans");
  el.classList.remove("show");
  void el.offsetWidth; /* 트랜지션 없이 즉시 반영되도록 강제 리플로우 */
  el.classList.remove("notrans");
}
function next(){
  if(!queue.length){ finish(); return; }
  cur = queue.shift();
  revealed = {kana:false, ko:false};

  /* 텍스트를 바꾸기 전에 먼저 트랜지션 없이 숨겨서, 새 카드의 뜻이 잠깐 비쳐 보이는 걸 방지 */
  hideInstant($("kana"));
  hideInstant($("ko"));

  const front = opts.reverse ? cur[2] : cur[0];
  $("kanji").textContent = front;
  $("kanji").style.fontSize = "";
  if(opts.reverse) $("kanji").style.fontSize = "clamp(22px,7vw,34px)";
  $("kana").textContent = cur[1];
  $("ko").textContent = opts.reverse ? cur[0] : cur[2];
  $("btnKana").classList.remove("done");
  $("btnKo").classList.remove("done");
  $("btnKo").textContent = opts.reverse ? "한자 보기" : "한국어 뜻";

  $("star").textContent = starred.has(cur[0]) ? "★" : "☆";
  $("star").classList.toggle("on", starred.has(cur[0]));
  $("wrongTag").textContent = wrongSet.has(cur[0]) ? "다시 나온 단어" : "";
  $("chip").textContent = "";
  updateHead();
}
function updateHead(){
  $("count").textContent = resolved.size + " / " + total;
  $("barFill").style.width = (total ? resolved.size/total*100 : 0) + "%";
  $("wrongN").textContent = wrongSet.size;
  $("leftN").textContent = Math.max(0, total - resolved.size);
}

$("btnKana").onclick = ()=>{ revealed.kana=true; $("kana").classList.add("show"); $("btnKana").classList.add("done"); };
$("btnKo").onclick   = ()=>{ revealed.ko=true;   $("ko").classList.add("show");   $("btnKo").classList.add("done"); };
$("card").onclick = e =>{
  if(e.target.id==="star") return;
  if(!revealed.kana) $("btnKana").onclick();
  else if(!revealed.ko) $("btnKo").onclick();
};
$("star").onclick = ()=>{
  if(!cur) return;
  if(starred.has(cur[0])) starred.delete(cur[0]); else starred.add(cur[0]);
  store.set("starred_app",[...starred]);
  $("star").textContent = starred.has(cur[0]) ? "★" : "☆";
  $("star").classList.toggle("on", starred.has(cur[0]));
};

$("btnKnow").onclick = ()=>{
  if(!cur) return;
  if(!wrongSet.has(cur[0])) knowCount++;
  resolved.add(cur[0]);
  next();
};
$("btnDont").onclick = ()=>{
  if(!cur) return;
  if(!wrongSet.has(cur[0])){ wrongSet.add(cur[0]); wrongOrder.push(cur); }
  resolved.delete(cur[0]);
  if(opts.repeat){
    const pos = Math.floor(Math.random()*(queue.length+1));
    queue.splice(pos, 0, cur);
  }
  next();
};

/* ---------------- 결과 ---------------- */
function finish(){
  clearInterval(timer);
  cur = null;
  const allKnown = wrongOrder.length===0;
  $("resTitle").textContent = allKnown ? "전부 외웠습니다" : "1회독 완료";
  $("resSub").textContent = curDeck.name + " · " + total + "단어";
  $("resKnow").textContent = knowCount;
  $("resDont").textContent = wrongOrder.length;
  $("resTime").textContent = fmt(seconds);

  const list = $("resList");
  list.innerHTML = "";
  wrongOrder.forEach(w=>{
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = '<span class="j"></span><span class="r"></span><span class="m"></span>';
    r.querySelector(".j").textContent = w[0];
    r.querySelector(".r").textContent = w[1];
    r.querySelector(".m").textContent = w[2];
    list.appendChild(r);
  });
  $("resListLabel").style.display = allKnown ? "none" : "";
  $("btnAgainWrong").style.display = allKnown ? "none" : "";
  $("result").classList.remove("hidden");
}
$("btnAgainWrong").onclick = ()=>{
  const again = wrongOrder.slice();
  $("result").classList.add("hidden");
  buildRound(again);
  $("deckName").textContent = curDeck.name + " · 복습";
  startTimer(); next();
};
$("btnAgainAll").onclick = ()=>{
  $("result").classList.add("hidden");
  buildRound(curDeck.words);
  $("deckName").textContent = curDeck.name;
  startTimer(); next();
};
$("btnBackHome").onclick = goHome;
$("btnHome").onclick = goHome;
function goHome(){
  clearInterval(timer);
  $("result").classList.add("hidden");
  renderHome();
  $("home").classList.remove("hidden");
}

/* 키보드 (맥 사파리용) */
document.addEventListener("keydown", e=>{
  if(!$("home").classList.contains("hidden") || !$("result").classList.contains("hidden")) return;
  if(e.code==="Space"){ e.preventDefault(); $("card").click(); }
  if(e.key==="1"||e.key==="ArrowLeft") $("btnKnow").click();
  if(e.key==="2"||e.key==="ArrowRight") $("btnDont").click();
});

renderHome();
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
</script>
